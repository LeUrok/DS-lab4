name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: |
          for svc in payment-service cars-service rental-service gateway-service; do
            echo "=== $svc ==="
            (cd $svc && go test ./... || true)
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        timeout-minutes: 10
        run: |
          TAG=${GITHUB_SHA::7}
          for svc in payment-service cars-service rental-service gateway-service; do
            docker buildx build --platform linux/amd64 \
              -t ${{ env.IMAGE_PREFIX }}/$svc:$TAG \
              --push ./$svc
          done
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      
      - name: Install cloudlogin
        run: |
          curl -LO https://github.com/cloud-ru-tech/cloudlogin/releases/latest/download/cloudlogin_Linux_amd64.tar.gz
          tar -xzf cloudlogin_Linux_amd64.tar.gz
          sudo mv cloudlogin /usr/local/bin/
          cloudlogin help

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy PostgreSQL
        run: |
          helm upgrade --install postgres ./charts/postgres \
            --namespace default \
            --wait --timeout 5m

      - name: Deploy services
        run: |
          TAG=${GITHUB_SHA::7}
          for svc in payment-service cars-service rental-service gateway-service; do
            helm upgrade --install $svc ./charts/app \
              -f ./charts/app/values-${svc%-service}.yaml \
              --set image.tag=$TAG \
              --namespace default \
              --wait --timeout 10m
          done

      - name: Install newman
        run: npm install -g newman

      - name: Wait before services are ready
        run: kubectl wait -n default -l app.kubernetes.io/name=gateway-service pod --for=condition=Ready --timeout 3m

      - name: Run API Tests
        run: |
          chmod +x ./scripts/test-script.sh
          ./scripts/test-script.sh v3 payment-service default

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true